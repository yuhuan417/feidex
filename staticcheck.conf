# Static analysis policy for feidex.
#
# Starts from staticcheck's default check set (which excludes the ST1000-family
# style checks) and additionally disables ST1005: all user-facing error text in
# this project is Chinese, and ST1005 targets English sentence casing, so it
# only produces false positives on CJK strings.
checks = ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
