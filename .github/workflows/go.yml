name: Go

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  release-dev-linux:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute dev version
        id: dev_meta
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version=dev-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build Linux dev binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.dev_meta.outputs.version }}"
          for target in "amd64:feidex-linux-amd64" "arm64:feidex-linux-aarch64"; do
            IFS=':' read -r GOARCH ASSET <<<"${target}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w -X feidex/internal/buildinfo.Version=${VERSION}" \
              -o "dist/${ASSET}" \
              ./cmd/feidex
          done

      - name: Package dev release assets
        run: |
          tar -C dist -czf dist/feidex-linux-amd64.tar.gz feidex-linux-amd64
          tar -C dist -czf dist/feidex-linux-aarch64.tar.gz feidex-linux-aarch64
          sha256sum \
            dist/feidex-linux-amd64 \
            dist/feidex-linux-amd64.tar.gz \
            dist/feidex-linux-aarch64 \
            dist/feidex-linux-aarch64.tar.gz \
            > dist/sha256sums.txt

      - name: Move dev-latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-latest "${GITHUB_SHA}"
          git push origin refs/tags/dev-latest --force

      - name: Publish dev GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: ${{ steps.dev_meta.outputs.version }}
          body: |
            Development build from `${{ github.sha }}`
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          files: |
            dist/feidex-linux-amd64
            dist/feidex-linux-amd64.tar.gz
            dist/feidex-linux-aarch64
            dist/feidex-linux-aarch64.tar.gz
            dist/sha256sums.txt

  release-linux:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v ./...

      - name: Build Linux release binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          for target in "amd64:feidex-linux-amd64" "arm64:feidex-linux-aarch64"; do
            IFS=':' read -r GOARCH ASSET <<<"${target}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w -X feidex/internal/buildinfo.Version=${VERSION}" \
              -o "dist/${ASSET}" \
              ./cmd/feidex
          done

      - name: Package release assets
        run: |
          tar -C dist -czf dist/feidex-linux-amd64.tar.gz feidex-linux-amd64
          tar -C dist -czf dist/feidex-linux-aarch64.tar.gz feidex-linux-aarch64
          sha256sum \
            dist/feidex-linux-amd64 \
            dist/feidex-linux-amd64.tar.gz \
            dist/feidex-linux-aarch64 \
            dist/feidex-linux-aarch64.tar.gz \
            > dist/sha256sums.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/feidex-linux-amd64
            dist/feidex-linux-amd64.tar.gz
            dist/feidex-linux-aarch64
            dist/feidex-linux-aarch64.tar.gz
            dist/sha256sums.txt
