name: Go

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  release-linux-amd64:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v ./...

      - name: Build Linux x86_64 binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/feidex-linux-amd64 \
            ./cmd/feidex

      - name: Package release assets
        run: |
          tar -C dist -czf dist/feidex-linux-amd64.tar.gz feidex-linux-amd64
          sha256sum dist/feidex-linux-amd64 dist/feidex-linux-amd64.tar.gz > dist/sha256sums.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/feidex-linux-amd64
            dist/feidex-linux-amd64.tar.gz
            dist/sha256sums.txt
