name: Go

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci-test:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  ci-cross-build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-build Windows
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  release-dev-meta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_ts_display: ${{ steps.meta.outputs.build_ts_display }}
    steps:
      - name: Compute dev version
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          BUILD_TS="$(date +%Y%m%dT%H%M%S)"
          BUILD_TS_DISPLAY="$(date '+%Y-%m-%d %H:%M:%S')"
          echo "version=dev-${BUILD_TS}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "build_ts_display=${BUILD_TS_DISPLAY}" >> "${GITHUB_OUTPUT}"

  release-dev-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-dev-meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: feidex-linux-amd64
          - goos: linux
            goarch: arm64
            asset: feidex-linux-aarch64
          - goos: darwin
            goarch: amd64
            asset: feidex-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: feidex-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: feidex-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: feidex-windows-arm64.exe
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build dev binary
        env:
          VERSION: ${{ needs.release-dev-meta.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X feidex/internal/buildinfo.Version=${VERSION}" \
            -o "dist/${{ matrix.asset }}" ./cmd/feidex

      - name: Upload dev binary
        uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release-dev-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-test, ci-cross-build, release-dev-meta, release-dev-build]
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dev binaries
        uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          path: dist
          merge-multiple: true

      - name: Package dev release assets
        run: |
          tar -C dist -czf dist/feidex-linux-amd64.tar.gz feidex-linux-amd64
          tar -C dist -czf dist/feidex-linux-aarch64.tar.gz feidex-linux-aarch64
          tar -C dist -czf dist/feidex-darwin-amd64.tar.gz feidex-darwin-amd64
          tar -C dist -czf dist/feidex-darwin-arm64.tar.gz feidex-darwin-arm64
          (cd dist && zip -q feidex-windows-amd64.zip feidex-windows-amd64.exe)
          (cd dist && zip -q feidex-windows-arm64.zip feidex-windows-arm64.exe)
          sha256sum \
            dist/feidex-linux-amd64 \
            dist/feidex-linux-amd64.tar.gz \
            dist/feidex-linux-aarch64 \
            dist/feidex-linux-aarch64.tar.gz \
            dist/feidex-darwin-amd64 \
            dist/feidex-darwin-amd64.tar.gz \
            dist/feidex-darwin-arm64 \
            dist/feidex-darwin-arm64.tar.gz \
            dist/feidex-windows-amd64.exe \
            dist/feidex-windows-amd64.zip \
            dist/feidex-windows-arm64.exe \
            dist/feidex-windows-arm64.zip \
            > dist/sha256sums.txt

      - name: Move dev-latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-latest "${GITHUB_SHA}"
          git push origin refs/tags/dev-latest --force

      - name: Publish dev GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: ${{ needs.release-dev-meta.outputs.version }}
          body: |
            Development build from `${{ github.sha }}`
            Built at: `${{ needs.release-dev-meta.outputs.build_ts_display }}`
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          files: |
            dist/feidex-linux-amd64
            dist/feidex-linux-amd64.tar.gz
            dist/feidex-linux-aarch64
            dist/feidex-linux-aarch64.tar.gz
            dist/feidex-darwin-amd64
            dist/feidex-darwin-amd64.tar.gz
            dist/feidex-darwin-arm64
            dist/feidex-darwin-arm64.tar.gz
            dist/feidex-windows-amd64.exe
            dist/feidex-windows-amd64.zip
            dist/feidex-windows-arm64.exe
            dist/feidex-windows-arm64.zip
            dist/sha256sums.txt

  release-test:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  release-build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: feidex-linux-amd64
          - goos: linux
            goarch: arm64
            asset: feidex-linux-aarch64
          - goos: darwin
            goarch: amd64
            asset: feidex-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: feidex-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: feidex-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: feidex-windows-arm64.exe
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binary
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X feidex/internal/buildinfo.Version=${VERSION}" \
            -o "dist/${{ matrix.asset }}" ./cmd/feidex

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release-publish:
    if: github.ref_type == 'tag'
    needs: [release-test, release-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Package release assets
        run: |
          tar -C dist -czf dist/feidex-linux-amd64.tar.gz feidex-linux-amd64
          tar -C dist -czf dist/feidex-linux-aarch64.tar.gz feidex-linux-aarch64
          tar -C dist -czf dist/feidex-darwin-amd64.tar.gz feidex-darwin-amd64
          tar -C dist -czf dist/feidex-darwin-arm64.tar.gz feidex-darwin-arm64
          (cd dist && zip -q feidex-windows-amd64.zip feidex-windows-amd64.exe)
          (cd dist && zip -q feidex-windows-arm64.zip feidex-windows-arm64.exe)
          sha256sum \
            dist/feidex-linux-amd64 \
            dist/feidex-linux-amd64.tar.gz \
            dist/feidex-linux-aarch64 \
            dist/feidex-linux-aarch64.tar.gz \
            dist/feidex-darwin-amd64 \
            dist/feidex-darwin-amd64.tar.gz \
            dist/feidex-darwin-arm64 \
            dist/feidex-darwin-arm64.tar.gz \
            dist/feidex-windows-amd64.exe \
            dist/feidex-windows-amd64.zip \
            dist/feidex-windows-arm64.exe \
            dist/feidex-windows-arm64.zip \
            > dist/sha256sums.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/feidex-linux-amd64
            dist/feidex-linux-amd64.tar.gz
            dist/feidex-linux-aarch64
            dist/feidex-linux-aarch64.tar.gz
            dist/feidex-darwin-amd64
            dist/feidex-darwin-amd64.tar.gz
            dist/feidex-darwin-arm64
            dist/feidex-darwin-arm64.tar.gz
            dist/feidex-windows-amd64.exe
            dist/feidex-windows-amd64.zip
            dist/feidex-windows-arm64.exe
            dist/feidex-windows-arm64.zip
            dist/sha256sums.txt
