name: Go

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Cross-build (Windows)
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...

  release-dev-linux:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute dev version
        id: dev_meta
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          BUILD_TS="$(date +%Y%m%dT%H%M%S)"
          BUILD_TS_DISPLAY="$(date '+%Y-%m-%d %H:%M:%S')"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "build_ts=${BUILD_TS}" >> "${GITHUB_OUTPUT}"
          echo "build_ts_display=${BUILD_TS_DISPLAY}" >> "${GITHUB_OUTPUT}"
          echo "version=dev-${BUILD_TS}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build dev binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.dev_meta.outputs.version }}"
          for target in \
            "linux:amd64:feidex-linux-amd64" \
            "linux:arm64:feidex-linux-aarch64" \
            "darwin:amd64:feidex-darwin-amd64" \
            "darwin:arm64:feidex-darwin-arm64" \
            "windows:amd64:feidex-windows-amd64.exe" \
            "windows:arm64:feidex-windows-arm64.exe"; do
            IFS=':' read -r GOOS GOARCH ASSET <<<"${target}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w -X feidex/internal/buildinfo.Version=${VERSION}" \
              -o "dist/${ASSET}" \
              ./cmd/feidex
          done

      - name: Package dev release assets
        run: |
          tar -C dist -czf dist/feidex-linux-amd64.tar.gz feidex-linux-amd64
          tar -C dist -czf dist/feidex-linux-aarch64.tar.gz feidex-linux-aarch64
          tar -C dist -czf dist/feidex-darwin-amd64.tar.gz feidex-darwin-amd64
          tar -C dist -czf dist/feidex-darwin-arm64.tar.gz feidex-darwin-arm64
          (cd dist && zip -q feidex-windows-amd64.zip feidex-windows-amd64.exe)
          (cd dist && zip -q feidex-windows-arm64.zip feidex-windows-arm64.exe)
          sha256sum \
            dist/feidex-linux-amd64 \
            dist/feidex-linux-amd64.tar.gz \
            dist/feidex-linux-aarch64 \
            dist/feidex-linux-aarch64.tar.gz \
            dist/feidex-darwin-amd64 \
            dist/feidex-darwin-amd64.tar.gz \
            dist/feidex-darwin-arm64 \
            dist/feidex-darwin-arm64.tar.gz \
            dist/feidex-windows-amd64.exe \
            dist/feidex-windows-amd64.zip \
            dist/feidex-windows-arm64.exe \
            dist/feidex-windows-arm64.zip \
            > dist/sha256sums.txt

      - name: Move dev-latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f dev-latest "${GITHUB_SHA}"
          git push origin refs/tags/dev-latest --force

      - name: Publish dev GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: ${{ steps.dev_meta.outputs.version }}
          body: |
            Development build from `${{ github.sha }}`
            Built at: `${{ steps.dev_meta.outputs.build_ts_display }}`
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          files: |
            dist/feidex-linux-amd64
            dist/feidex-linux-amd64.tar.gz
            dist/feidex-linux-aarch64
            dist/feidex-linux-aarch64.tar.gz
            dist/feidex-darwin-amd64
            dist/feidex-darwin-amd64.tar.gz
            dist/feidex-darwin-arm64
            dist/feidex-darwin-arm64.tar.gz
            dist/feidex-windows-amd64.exe
            dist/feidex-windows-amd64.zip
            dist/feidex-windows-arm64.exe
            dist/feidex-windows-arm64.zip
            dist/sha256sums.txt

  release-linux:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v ./...

      - name: Build release binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          for target in \
            "linux:amd64:feidex-linux-amd64" \
            "linux:arm64:feidex-linux-aarch64" \
            "darwin:amd64:feidex-darwin-amd64" \
            "darwin:arm64:feidex-darwin-arm64" \
            "windows:amd64:feidex-windows-amd64.exe" \
            "windows:arm64:feidex-windows-arm64.exe"; do
            IFS=':' read -r GOOS GOARCH ASSET <<<"${target}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w -X feidex/internal/buildinfo.Version=${VERSION}" \
              -o "dist/${ASSET}" \
              ./cmd/feidex
          done

      - name: Package release assets
        run: |
          tar -C dist -czf dist/feidex-linux-amd64.tar.gz feidex-linux-amd64
          tar -C dist -czf dist/feidex-linux-aarch64.tar.gz feidex-linux-aarch64
          tar -C dist -czf dist/feidex-darwin-amd64.tar.gz feidex-darwin-amd64
          tar -C dist -czf dist/feidex-darwin-arm64.tar.gz feidex-darwin-arm64
          (cd dist && zip -q feidex-windows-amd64.zip feidex-windows-amd64.exe)
          (cd dist && zip -q feidex-windows-arm64.zip feidex-windows-arm64.exe)
          sha256sum \
            dist/feidex-linux-amd64 \
            dist/feidex-linux-amd64.tar.gz \
            dist/feidex-linux-aarch64 \
            dist/feidex-linux-aarch64.tar.gz \
            dist/feidex-darwin-amd64 \
            dist/feidex-darwin-amd64.tar.gz \
            dist/feidex-darwin-arm64 \
            dist/feidex-darwin-arm64.tar.gz \
            dist/feidex-windows-amd64.exe \
            dist/feidex-windows-amd64.zip \
            dist/feidex-windows-arm64.exe \
            dist/feidex-windows-arm64.zip \
            > dist/sha256sums.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/feidex-linux-amd64
            dist/feidex-linux-amd64.tar.gz
            dist/feidex-linux-aarch64
            dist/feidex-linux-aarch64.tar.gz
            dist/feidex-darwin-amd64
            dist/feidex-darwin-amd64.tar.gz
            dist/feidex-darwin-arm64
            dist/feidex-darwin-arm64.tar.gz
            dist/feidex-windows-amd64.exe
            dist/feidex-windows-amd64.zip
            dist/feidex-windows-arm64.exe
            dist/feidex-windows-arm64.zip
            dist/sha256sums.txt
