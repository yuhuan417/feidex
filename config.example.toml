data_dir = ".feidex-data"

[log]
level = "info"

# ── Default feishu frontend (used when no [[frontend]] sections exist) ──
# The "backend" field selects which coding agent this frontend talks to.
# Valid values: "codex" | "claude"
# Leave unset to get an interactive backend-chooser card on first message.
[feishu]
# backend = ""
app_id = "cli_xxx"
app_secret = "sec_xxx"
allow_from = []
debug_allow_from = []
group_at_only = true
respond_to_at_everyone = false
card_enabled = true
reply_in_thread = true
quiet = "progress"

# ── Multi-frontend support (optional) ──
# Define multiple [[frontend]] sections to run several feishu bots
# from one process, each pointing at its own backend.
#
# [[frontend]]
# id = "feishu-codex"
# backend = "codex"
# app_id = "cli_xxx"
# app_secret = "sec_xxx"
# allow_from = []
# card_enabled = true
# reply_in_thread = true
# quiet = "progress"
#
# [[frontend]]
# id = "feishu-claude"
# backend = "claude"
# app_id = "cli_yyy"
# app_secret = "sec_yyy"
# allow_from = []
# card_enabled = true
# reply_in_thread = true
# quiet = "progress"

# ── Codex backend settings ──
[codex]
command = "codex"
transport = "stdio"
experimental_api = true
service_name = "feidex"
# model = "gpt-5.4"
# reasoning_effort = "medium"
# plan_model = "gpt-5.4"
# plan_reasoning_effort = "medium"
# app_server_dir = "/srv/shared-codex-dir"

# ── Claude backend settings ──
[claude]
command = "claude"
model = "sonnet"
# effort = "medium"
permission_mode = "default"
permission_prompt_tool_stdio = true
# disable_plugins = true
# system_prompt = "..."

[daemon]
service_name = "feidex"

[[workspace]]
id = "default"
name = "Default"
cwd = "."
approval_policy = "on-request"
sandbox_mode = "workspace-write"
