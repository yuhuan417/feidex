data_dir = ".feidex-data"

[log]
level = "info"

[feishu]
app_id = "cli_xxx"
app_secret = "sec_xxx"
allow_from = []
debug_allow_from = []
group_at_only = true
respond_to_at_everyone = false
card_enabled = true
reply_in_thread = true
quiet = "progress"

[codex]
command = "codex"
transport = "stdio"
# app_server_dir = "/srv/shared-codex-dir"
experimental_api = true
service_name = "feidex"
# model = "gpt-5.4"
# reasoning_effort = "medium"

[claude]
command = "claude"
model = "sonnet"
permission_mode = "default"
permission_prompt_tool_stdio = true
# disable_plugins = true
# system_prompt = "..."

[daemon]
service_name = "feidex"

[[workspace]]
id = "default"
name = "Default"
backend = "codex"
cwd = "."
model = "gpt-5.4"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
